name: Release
on:
  push:
    tags: ["v*"]

# Jobs opt into more where they need it (OIDC to publish, contents to release).
permissions:
  contents: read

jobs:
  # Release gates on the same checks CI runs, re-run here rather than trusted from a
  # push: a tag can be pushed at a commit whose CI never ran, or ran and failed. `build`
  # waits for all of them, and `publish-pypi` uploads the artifact `build` produced -
  # so what is published is what was validated, not a second build of the same source.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install pip-audit
      - name: Known vulnerabilities in dependencies
        run: |
          python - <<'EOF' > deps.txt
          import tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          print("\n".join(project["dependencies"] + project["optional-dependencies"]["dev"]))
          EOF
          pip-audit --strict --progress-spinner off -r deps.txt

  cross-platform-tests:
    # 1.3.1 published a Windows-only UnicodeEncodeError because this workflow tested
    # on Linux alone. Publishing now waits for the platforms users actually run on.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: [lint, audit, cross-platform-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip }
      - name: Tag matches package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"; exit 1
          fi
      - run: pip install -e ".[dev]" build twine
      - name: Tests (no API key — cassettes replay)
        run: pytest -q
      - run: python -m build
      - run: twine check dist/*
      - name: The built wheel works from a clean environment
        # The artifact itself, not the source tree: a module missing from the wheel or
        # a console script that does not resolve passes every test above.
        run: python scripts/wheel_smoke.py --wheel "$(ls dist/*.whl)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: dist, path: dist/ }

  # The same artifact, on the other two platforms, before anything is published.
  installed-wheel:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist, path: dist/ }
      - name: The published wheel works from a clean environment
        shell: bash
        run: python scripts/wheel_smoke.py --wheel "$(ls dist/*.whl)"

  publish-pypi:
    needs: [build, installed-wheel]
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies this workflow via OIDC. No token is stored.
    environment:
      name: pypi
      url: https://pypi.org/project/evalseal/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: dist, path: dist/ }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
