name: CI
on: [push, pull_request]

# Least privilege: CI only ever needs to read the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install pip-audit
      - name: Known vulnerabilities in dependencies
        # Audit the declared dependency set, not the environment: auditing the
        # installed project itself just asks PyPI about a version being released.
        run: |
          python - <<'EOF' > deps.txt
          import tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          print("\n".join(project["dependencies"] + project["optional-dependencies"]["dev"]))
          EOF
          cat deps.txt
          pip-audit --strict --progress-spinner off -r deps.txt

  # Three lanes, deliberately separate.
  #
  #   test   - behaviour, from the source tree with `pythonpath = ["src"]`
  #   wheel  - packaging, from the built artifact outside the repository
  #   minimum-deps - the lower bounds in pyproject, so they are claims and not guesses
  #
  # The first cannot catch a module missing from the wheel, `py.typed` not shipped or a
  # console script that does not resolve; the second cannot sensibly re-run 1300 tests.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # The ledger lock uses msvcrt on Windows and fcntl everywhere else, so the
          # concurrency guarantee is only tested if Windows is in the matrix.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "${{ matrix.python-version }}", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Tests (no API key — cassettes replay)
        run: pytest -q --cov=evalseal --cov-fail-under=90
      - name: Demo run reproduces from cassette
        if: runner.os != 'Windows'
        run: |
          if [ ! -f tests/cassettes/run.json ]; then
            echo "::warning::tests/cassettes/run.json not recorded yet; skipping demo replay."
            exit 0
          fi
          set +e
          evalseal run \
            --dataset examples/borderline_judge/dataset.jsonl \
            --target-config examples/borderline_judge/target.json \
            --scorer-config examples/borderline_judge/scorer.json \
            --n 5 --cassette tests/cassettes/run.json --quiet --junit-xml junit.xml
          code=$?
          # 0 = policy satisfied, 3 = cases failed --fail-on (expected for this demo).
          # Anything else means the replay itself broke.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
      - name: GSM8K suite reproduces from cassette
        if: runner.os != 'Windows'
        run: |
          if [ ! -f tests/cassettes/gsm8k.json ]; then
            echo "::warning::gsm8k cassette not recorded; skipping."; exit 0
          fi
          evalseal run --suite examples/gsm8k/suite.json --ledger .evalseal/gsm8k.jsonl --quiet
      - name: Code-QA suite reproduces from cassette
        if: runner.os != 'Windows'
        run: |
          if [ ! -f tests/cassettes/codeqa.json ]; then
            echo "::warning::codeqa cassette not recorded; skipping."; exit 0
          fi
          evalseal run --suite examples/codeqa/suite.json --ledger .evalseal/codeqa.jsonl --quiet
      - name: Signing round trip
        if: runner.os != 'Windows'
        run: |
          evalseal keygen --private-key ci.key --public-key ci.pub
          evalseal sign --ledger .evalseal/gsm8k.jsonl --key ci.key
          evalseal verify --ledger .evalseal/gsm8k.jsonl --public-key ci.pub
      - name: Ledger integrity
        if: runner.os != 'Windows'
        run: evalseal verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-${{ matrix.python-version }}
          path: |
            junit.xml
            report.md
            report.json
          if-no-files-found: ignore

  # Packaging, on every platform users run on. Nothing here imports from `src/`: the
  # script asserts that `import evalseal` resolves outside the repository, which is the
  # one check that makes the rest of it mean anything.
  wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install build
      - name: The built wheel works from a clean environment
        run: python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: wheel-${{ matrix.os }}
          path: dist/
          if-no-files-found: ignore

  # The lower bounds in pyproject are a promise to anyone who installs alongside other
  # packages. Resolving the newest of everything never tests them, so this lane pins
  # each dependency to exactly its declared minimum and runs the suite against it. When
  # it fails, either the bound is wrong or the code uses something newer than it claims.
  minimum-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11", cache: pip }
      - name: Pin every declared dependency to its lower bound
        run: |
          python - <<'EOF' > constraints.txt
          import re, tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          declared = project["dependencies"] + project["optional-dependencies"]["dev"]
          for spec in declared:
              name, _, bound = spec.partition(">=")
              bound = bound.split(";")[0].split("#")[0].strip()
              if bound:
                  print(f"{name.strip()}=={bound}")
          EOF
          cat constraints.txt
      - run: pip install -e ".[dev,yaml]" -c constraints.txt
      - name: The versions actually installed
        run: pip list
      - name: Tests against the declared minimums
        run: pytest -q
