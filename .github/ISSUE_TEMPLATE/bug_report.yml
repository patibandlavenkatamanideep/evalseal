name: Bug report
description: Something behaves differently than documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: evalseal version, placeholder: "0.3.0 (evalseal --help / pip show evalseal)" }
    validations: { required: true }
  - type: input
    id: python
    attributes: { label: Python version, placeholder: "3.12.4" }
    validations: { required: true }
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected, and what happened instead }
    validations: { required: true }
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Redact API keys. Cassettes and reports may contain your prompts.
      render: text
