name: CI
on: [push, pull_request]

# Least privilege: CI only ever needs to read the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install pip-audit
      - name: Known vulnerabilities in dependencies
        # Audit the declared dependency set, not the environment: auditing the
        # installed project itself just asks PyPI about a version being released.
        run: |
          python - <<'EOF' > deps.txt
          import tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          print("\n".join(project["dependencies"] + project["optional-dependencies"]["dev"]))
          EOF
          cat deps.txt
          pip-audit --strict --progress-spinner off -r deps.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ matrix.python-version }}", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Tests (no API key — cassettes replay)
        run: pytest -q --cov=evalseal --cov-fail-under=90
      - name: Demo run reproduces from cassette
        run: |
          if [ ! -f tests/cassettes/run.json ]; then
            echo "::warning::tests/cassettes/run.json not recorded yet; skipping demo replay."
            exit 0
          fi
          set +e
          evalseal run \
            --dataset examples/borderline_judge/dataset.jsonl \
            --target-config examples/borderline_judge/target.json \
            --scorer-config examples/borderline_judge/scorer.json \
            --n 5 --cassette tests/cassettes/run.json --quiet --junit-xml junit.xml
          code=$?
          # 0 = policy satisfied, 3 = cases failed --fail-on (expected for this demo).
          # Anything else means the replay itself broke.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
      - name: Ledger integrity
        run: evalseal verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-${{ matrix.python-version }}
          path: |
            junit.xml
            report.md
            report.json
          if-no-files-found: ignore
