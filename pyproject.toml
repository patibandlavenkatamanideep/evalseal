[project]
name = "evalseal"
version = "1.5.0"
description = "Reproducibility and provenance receipts for LLM evaluations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Venkata Manideep Patibandla" }]
keywords = ["llm", "evaluation", "reproducibility", "provenance", "llm-as-judge"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "httpx>=0.27",
  "rich>=13.7",
  "cryptography>=42",   # Ed25519 signatures over ledger heads
]

[project.urls]
Homepage = "https://github.com/patibandlavenkatamanideep/evalseal"
Issues = "https://github.com/patibandlavenkatamanideep/evalseal/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
evalseal = "evalseal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalseal"]

[tool.hatch.build.targets.wheel.force-include]
"src/evalseal/py.typed" = "evalseal/py.typed"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer declares CLI options as argument defaults; that is the framework idiom.
"src/evalseal/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
