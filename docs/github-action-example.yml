# Drop-in GitHub Action for gating a pull request on eval reproducibility.
#
# It replays a committed cassette, so it needs no API key and costs nothing. Swap the
# replay for a live run (and add your key as a secret) when you want fresh numbers.
name: Eval reproducibility

on: [pull_request]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The [yaml] extra is only needed for a YAML policy file; a JSON one
      # works with a plain `pip install evalseal`.
      - run: pip install 'evalseal[yaml]'

      # Replay the committed cassette. Exit 3 means cases violated --fail-on; the
      # gate below decides whether that should fail the build, so tolerate it here.
      - name: Run the eval
        run: |
          set +e
          evalseal run --suite evals/suite.json --quiet --show-cases --unstable-only
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      # The receipt must be internally consistent before its numbers mean anything.
      - name: Verify the ledger
        run: evalseal verify

      # Thresholds live in evals/evalseal.yml, so loosening one shows up in review
      # rather than in a shell line nobody reads. Every rule that ran is printed.
      - name: Gate
        run: evalseal gate --policy evals/evalseal.yml

      # Or, without a policy file:
      #   evalseal gate --min-score 0.85 --max-flip-rate 0.20 --critical b01,b05

      - name: Publish the per-case report
        if: always()
        run: |
          evalseal report --json > evalseal-report.json
          evalseal report --html evalseal-report.html

      # A self-contained page: no network needed to read it months from now.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evalseal-report
          path: |
            evalseal-report.json
            evalseal-report.html
            report.md
          if-no-files-found: ignore
