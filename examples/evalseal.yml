# A policy that lives in the repo, so loosening a threshold shows up in review.
# Use it with: evalseal gate --policy examples/evalseal.yml
version: 1

run:
  # The suite has to clear these on its own.
  min_score: 0.95
  max_flip_rate: 0.20        # per case, not the average
  max_unstable_cases: 1
  verify_ledger: true        # the hash chain has to check out (default)

cases:
  # `critical` means "must not flip", not "must pass": a case that fails the same way
  # every time is stable, and a stable failure is usually a broken eval item, not a
  # broken model. Use min_score below when you mean the case has to be right.
  critical:
    - gsm001
    - gsm007
  min_score:
    gsm001: 1.0

# Uncomment once a baseline receipt is checked in. The path is relative to this file.
# drift:
#   baseline: baselines/main.json
#   require_comparable: true   # refuse to compare across a changed rubric or dataset
#   max_score_regression: 0.02 # fails only if the paired test also supports a regression
#   allow_new_unstable: false  # a case that starts flipping fails the build
#   allow_removed_cases: false # quietly dropping a hard case is not an improvement
