# EvalSeal PR receipt workflow.
#
# Copy to .github/workflows/evalseal.yml. On every pull request it replays a committed
# cassette (no API key, no network, no cost), verifies the sealed record and the files
# it was sealed against, gates it against a checked-in policy and a pre-registration,
# compares it with a baseline receipt, reports judge drift, anchors the receipt and
# re-checks the anchor, uploads everything, and writes a step summary that says why the
# check passed or failed.
#
# Nothing here needs a secret or an external service. Every step runs offline.
#
# Guide: docs/pr-receipt-workflow.md
name: EvalSeal receipt

on:
  pull_request:

# Read-only. The step summary and artifact upload need no write scope. Never switch this
# to pull_request_target: that runs with the base repository's secrets while checking out
# code from the fork.
permissions:
  contents: read

env:
  # Pin the tool that seals the receipt; the version is sealed into the receipt too.
  #
  # `anchor`, `anchor-verify` and `gate --expect-evaluator` land in 2.1.0, which is NOT
  # published yet, so this installs from the commit that adds them. After 2.1.0 is on
  # PyPI, replace this line with the released pin:
  #   EVALSEAL_SPEC: "evalseal[yaml]==2.1.0"
  EVALSEAL_SPEC: "evalseal[yaml] @ git+https://github.com/patibandlavenkatamanideep/evalseal@12989bacb931f7e8f75ef2cfa88695a5193eee76"
  # The suite to replay. Its cassette must be committed, or the run fails loudly.
  SUITE: examples/gsm8k/suite.json
  # Thresholds, critical cases and pins. A policy lists every check it ran, passed or
  # failed, which is what lets a reviewer see why the check passed.
  POLICY: examples/evalseal.yml
  # Optional: a pre-registration written by `evalseal preregister` and committed before
  # the run. It fixes the suite, dataset, case ids, repeat count and required artifacts,
  # so a quiet edit to any of them fails the gate by name. Leave the file out and the
  # gate simply applies the policy. See docs/pre-registration.md for what this does and
  # does not establish - it cannot prove no private run happened.
  PREREG: examples/prereg.json
  # Optional: a receipt from the default branch to compare against. Leave the file out
  # and the drift step is skipped, and the summary says so.
  BASELINE_RECEIPT: evals/baseline-receipt.json
  LEDGER: .evalseal/pr.jsonl

jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }

      - name: Install EvalSeal
        # The [yaml] extra is only needed because the policy file is YAML.
        run: pip install "$EVALSEAL_SPEC"

      - name: Replay the suite from its cassette
        # --fail-on none: this step records and seals; the gate below decides pass/fail.
        # Exit 1 here means the replay itself broke - most often a cassette that does
        # not match the dataset any more. That is a real failure, not a flaky one.
        run: |
          evalseal run --suite "$SUITE" --ledger "$LEDGER" \
            --html receipt.html --fail-on none --quiet
          evalseal report report.json --json > receipt-summary.json

      - name: Verify the sealed record and its artifacts
        # Recomputes the record's hash from its content and checks the chain links, then
        # re-hashes the files it was sealed against - the cassette above all, which holds
        # the responses the verdicts came from. The output is kept so the summary can
        # show which artifacts were checked rather than only that the step passed.
        run: |
          set -o pipefail
          evalseal verify --ledger "$LEDGER" --artifacts | tee verify.txt

      - name: Gate against the policy and the pre-registration
        id: gate
        # The outcome is recorded rather than acted on here, so the summary and the
        # artifacts are written even when the gate fails. The last step fails the job.
        #
        # --prereg is added only when the file exists, so a repository without a
        # pre-registration still gets the policy gate. Both sets of checks land in
        # gate.json under the same `checks` list, prefixed `prereg.` or the policy's
        # own rule names.
        run: |
          set +e
          PREREG_ARGS=""
          if [ -f "$PREREG" ]; then PREREG_ARGS="--prereg $PREREG"; fi
          evalseal gate --ledger "$LEDGER" --policy "$POLICY" $PREREG_ARGS --json > gate.json
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Compare with the baseline receipt
        if: hashFiles(env.BASELINE_RECEIPT) != ''
        # diff always exits 0: it reports, it does not gate. Comparability comes first in
        # its output, and the summary below keeps it first.
        run: |
          evalseal diff "$BASELINE_RECEIPT" report.json --json > drift.json
          evalseal diff "$BASELINE_RECEIPT" report.json --html drift.html > /dev/null

      - name: Report judge drift against the baseline
        if: hashFiles(env.BASELINE_RECEIPT) != ''
        # `diff` asks whether the score moved. `drift` asks what moved underneath it:
        # whether the grading setup changed, which cases came back with a different
        # verdict, and whether that is the judge disagreeing with itself or the target
        # answering differently. It reports; it does not gate.
        run: |
          evalseal drift "$BASELINE_RECEIPT" report.json --json > judge-drift.json
          evalseal drift "$BASELINE_RECEIPT" report.json --out judge-drift.md > /dev/null

      - name: Anchor the receipt and re-check the anchor
        # A local anchor binds the receipt, its ledger head and its signature state into
        # one file anyone can re-check with `evalseal anchor-verify`. Verifying it here
        # proves the file that gets uploaded actually round-trips.
        #
        # It is NOT an external timestamp: created_at is this runner's clock. For an
        # independent time add `--with rfc3161 --tsa <your authority>`; that backend is
        # experimental and does not verify the authority's signature. See
        # docs/external-anchoring.md.
        id: anchor
        run: |
          set +e
          evalseal anchor report.json --ledger "$LEDGER" --out anchor.json
          evalseal anchor-verify anchor.json report.json --ledger "$LEDGER" \
            > anchor-verify.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat anchor-verify.txt

      - name: Write the step summary
        if: always()
        shell: python
        env:
          ANCHOR_CODE: ${{ steps.anchor.outputs.code }}
        run: |
          import json, os, pathlib

          def load(name):
              try:
                  return json.loads(pathlib.Path(name).read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return None

          def text(name):
              try:
                  return pathlib.Path(name).read_text(encoding="utf-8").strip()
              except OSError:
                  return ""

          receipt, gate, drift = load("receipt-summary.json"), load("gate.json"), load("drift.json")
          judge_drift = load("judge-drift.json")
          lines = ["# EvalSeal receipt", ""]

          # Comparability is the headline, ahead of the gate result and every number.
          # A score delta between runs that were graded differently is not a change, so
          # it must not be the first thing a reviewer's eye lands on - and a reviewer
          # who reads only one line should read this one.
          if drift is None:
              lines += ["**Comparability:** no baseline receipt, so nothing was compared.", ""]
          elif drift["comparable"]:
              lines += ["**Comparable with the baseline:** yes, same grading setup.", ""]
          else:
              changed = ", ".join(c["field"] for c in drift["evaluator_changes"]) or "unknown"
              lines += [f"# NOT COMPARABLE with the baseline ({changed} changed)", "",
                        "The grading setup moved, so any score difference below is not a "
                        "change in the model and must not be read as one.", ""]

          if gate is None:
              lines += ["**No gate result.** An earlier step failed; open the job log.", ""]
          else:
              verdict = "PASSED" if gate["passed"] else "FAILED"
              against = [f"`{os.environ['POLICY']}`"]
              declared = any(c["rule"].startswith("prereg.") for c in gate["checks"])
              if declared:
                  against.append(f"the pre-registration `{os.environ['PREREG']}`")
              lines += [f"**Gate {verdict}** against {' and '.join(against)}.", ""]
              if not declared:
                  lines += ["No pre-registration was applied, so nothing checked that this "
                            "is the evaluation that was declared beforehand. See "
                            "docs/pre-registration.md.", ""]

          # Comparability before any number: a delta between runs graded differently is
          # not a change, and it must not be the first thing a reviewer reads.
          if drift is not None:
              if drift["comparable"]:
                  paired = drift.get("paired") or {}
                  ci = paired.get("ci95", [0, 0])
                  lines += [
                      "| baseline | this PR | difference | 95% CI | p | discordant items | verdict |",
                      "|---|---|---|---|---|---|---|",
                      f"| {drift['score']['before']:.3f} | {drift['score']['after']:.3f} "
                      f"| {paired.get('delta', 0):+.4f} | [{ci[0]:+.4f}, {ci[1]:+.4f}] "
                      f"| {paired.get('p_value', 1):.4g} | {paired.get('n_discordant', 0)} "
                      f"| **{drift['score']['verdict']}** |",
                      "",
                  ]
                  if drift["score"]["verdict"] == "inconclusive":
                      lines += ["`inconclusive` means this experiment could not tell, not "
                                "that the runs are the same. `evalseal power` says what it "
                                "would take.", ""]
              else:
                  # evaluator_changes, not config_changes: the latter also lists a new
                  # target model, which is not a grading change.
                  changed = ", ".join(c["field"] for c in drift["evaluator_changes"]) or "unknown"
                  lines += [
                      f"Evaluator fields that changed: {changed}.",
                      "",
                      f"Score {drift['score']['before']:.3f} to {drift['score']['after']:.3f} "
                      "(not comparable).",
                      "",
                  ]
          else:
              lines += ["No baseline receipt, so no drift comparison ran.", ""]

          if gate is not None and (gate["checks"] or gate["failures"]):
              lines += ["| check | result | detail |", "|---|---|---|"]
              for check in gate["checks"]:
                  mark = "ok" if check["passed"] else "**FAIL**"
                  lines.append(f"| `{check['rule']}` | {mark} | {check['detail']} |")
              policy_rules = {c["rule"] for c in gate["checks"] if not c["passed"]}
              for failure in gate["failures"]:
                  if failure.split(":", 1)[0] not in policy_rules:
                      lines.append(f"| flag | **FAIL** | {failure} |")
              lines.append("")

          if receipt is not None:
              s, p = receipt["summary"], receipt["provenance"]
              unstable = [c["case_id"] for c in receipt["cases"] if c["stability"] == "UNSTABLE"]
              lines += [
                  "| | |", "|---|---|",
                  f"| EvalSeal version (sealed) | `{p['evalseal_version']}` |",
                  f"| suite | `{os.environ['SUITE']}` |",
                  f"| target model | `{p['target_model']}`"
                  + (f" (served `{p['served_model']}`)"
                     if p.get("served_model") and p["served_model"] != p["target_model"]
                     else "") + " |",
                  f"| mean score | {s['mean_score']:.3f} over {s['n_cases']} cases |",
                  f"| mean flip rate | {s['flip_rate']:.1%} |",
                  f"| unstable cases | {len(unstable)}"
                  + (f": {', '.join(unstable[:20])}" if unstable else "") + " |",
                  f"| evaluator fingerprint | `{p['evaluator_fingerprint'][:23]}...` |",
                  f"| sealed hash | `{s['sealed_hash'][:23]}...` |",
                  "",
              ]

          # What moved underneath the score, when a baseline was available.
          if judge_drift is not None:
              kind = judge_drift["kind"].replace("_", " ")
              lines += [f"**Judge drift: {kind}.** {judge_drift['summary']}", ""]
              worst = [c for c in judge_drift["cases"] if c["after"]["flip_rate"] > 0][:5]
              if worst:
                  lines += ["| least stable case | verdicts | flip rate |", "|---|---|---|"]
                  lines += [f"| `{c['case_id']}` | `{c['after']['sequence']}` "
                            f"| {c['after']['flip_rate']:.0%} |" for c in worst]
                  lines.append("")

          # Artifact verification and the anchor, verbatim. Both are short, and a
          # paraphrase of a check result is one more place for it to drift from what ran.
          verified, anchor_out = text("verify.txt"), text("anchor-verify.txt")
          if verified or anchor_out:
              lines += ["<details><summary>Artifact and anchor verification</summary>", ""]
              if verified:
                  lines += ["```", verified, "```", ""]
              if anchor_out:
                  anchor_code = os.environ.get("ANCHOR_CODE", "?")
                  state = "verified" if anchor_code == "0" else f"FAILED (exit {anchor_code})"
                  lines += [f"Anchor {state}. A local anchor is this runner's clock: it "
                            "binds the receipt, ledger head and artifacts together, and "
                            "establishes nothing about when.", "", "```", anchor_out, "```", ""]
              lines += ["</details>", ""]

          artifacts = [n for n in ("receipt.html", "report.md", "report.json", "drift.html",
                                   "drift.json", "judge-drift.md", "judge-drift.json",
                                   "gate.json", "anchor.json", "verify.txt")
                       if pathlib.Path(n).exists()]
          lines += [
              f"**Artifacts** (`evalseal-receipt`): {', '.join(artifacts)}", "",
              "**What to inspect.** If the gate failed, the check table says which rule. If "
              "a case is unstable, open `receipt.html` - its verdict strip shows which "
              "repeats disagreed. If the baseline is not comparable, the grading changed in "
              "this PR, and that change is what needs review, not the score.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evalseal-receipt
          # Hashes and scores only. Prompts and responses are never written into these
          # files; the cassette that holds them stays in the repository.
          path: |
            receipt.html
            report.md
            report.json
            receipt-summary.json
            gate.json
            drift.html
            drift.json
            judge-drift.md
            judge-drift.json
            anchor.json
            anchor-verify.txt
            verify.txt
            ${{ env.LEDGER }}
          if-no-files-found: ignore

      - name: Fail the check if the gate failed
        if: steps.gate.outputs.code != '0'
        env:
          GATE_CODE: ${{ steps.gate.outputs.code }}
        run: |
          echo "::error::EvalSeal gate failed with exit code $GATE_CODE; see the step summary."
          exit 1
