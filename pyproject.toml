[project]
name = "evalseal"
version = "0.1.0"
description = "Reproducibility and provenance receipts for LLM evaluations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Venkata Manideep Patibandla" }]
keywords = ["llm", "evaluation", "reproducibility", "provenance", "llm-as-judge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "httpx>=0.27",
  "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/patibandlavenkatamanideep/evalseal"
Issues = "https://github.com/patibandlavenkatamanideep/evalseal/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
evalseal = "evalseal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalseal"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
